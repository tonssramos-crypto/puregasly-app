# Render Blueprint - deploys the API and the React site together.
# Render dashboard -> New -> Blueprint -> pick your repo.
services:
  # ---------- API (Express + MongoDB) ----------
  - type: web
    name: puregasly-api
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: NODE_ENV           # turns on HTTPS enforcement, Secure cookies and strict startup checks
        value: production
      - key: MONGODB_URI        # paste your MongoDB Atlas connection string
        sync: false
      - key: JWT_SECRET         # generated for you by Render
        generateValue: true
      - key: FIELD_ENCRYPTION_KEY   # generated by Render; encrypts addresses/phones. BACK THIS UP - losing it loses that data.
        generateValue: true
      - key: ADMIN_PASSWORD     # choose a strong password (12+ chars) for the built-in admin account
        sync: false
      - key: CLIENT_ORIGIN      # the URL of the static site below, e.g. https://puregasly-web.onrender.com
        sync: false

  # ---------- React site (Vite) ----------
  - type: web
    name: puregasly-web
    runtime: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: VITE_API_URL       # e.g. https://puregasly-api.onrender.com/api
        sync: false
    routes:
      # Single-page app: send every path to index.html so refreshing /orders etc. works.
      - type: rewrite
        source: /*
        destination: /index.html
